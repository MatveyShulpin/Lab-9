<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список посещённых городов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            margin: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px 30px;
            border-radius: 6px;
        }
        form {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 6px 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            background: #3498db;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
    </style>
</head>
<body>
<header>
    <h1>Мои путешествия</h1>
</header>
<div class="container">
    <h2>Добавить посещённый город</h2>
    <form method="post">
        <label for="town">Город:</label>
        <input type="text" id="town" name="town" required>

        <label for="visit_date">Дата посещения:</label>
        <input type="date" id="visit_date" name="visit_date" required>

        <button type="submit">Сохранить</button>
    </form>

    <h2>Список посещённых городов</h2>
    {% if visits %}
        <table>
            <tr>
                <th>Город</th>
                <th>Дата посещения</th>
                <th></th>
            </tr>
            {% for v in visits %}
            <tr>
                <td>{{ v.town }}</td>
                <td>{{ v.visit_date.strftime("%d.%m.%Y") }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>Пока ничего нет. Добавьте первый город!</p>
    {% endif %}
</div>
</body>
</html>
